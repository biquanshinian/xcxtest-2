<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>火箭体量尺</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      background: #0B0C0E;
      color: #F4F1EA;
    }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="app">
    <main class="scroller" id="scroller">
      <section class="view is-active" data-view="home" id="view-home">
        <button type="button" class="btn-primary" data-action="start">开始量体量</button>
      </section>

      <section class="view" data-view="pick" id="view-pick" hidden>
        <p class="pick-hint">选一型，跟人楼飞机比多高</p>
        <div class="filter-row" id="rocket-filters"></div>
        <div class="card-list" id="rocket-list"></div>
      </section>

      <section class="view" data-view="result" id="view-result" hidden>
        <div class="ruler-panel">
          <div class="ruler-head">
            <div>
              <h3 id="result-name">火箭</h3>
              <p>同一比例，地面齐平</p>
            </div>
            <button type="button" class="text-btn" data-action="swap-rocket">换一型</button>
          </div>
          <canvas id="ruler-canvas" width="320" height="456"></canvas>
        </div>
        <div class="stat-box" id="stat-box"></div>
        <div class="panel">
          <h3>可复制说明</h3>
          <div class="selectable note-text" id="scale-note"></div>
        </div>
        <div class="bottom-space"></div>
      </section>
    </main>

    <footer class="dock" id="result-dock" hidden>
      <button type="button" class="btn-primary" data-action="save-card">保存卡片</button>
      <button type="button" class="btn-ghost" data-action="post-note">发笔记</button>
      <button type="button" class="btn-ghost" data-action="search-notes">搜相关</button>
    </footer>

    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="./data.js"></script>
  <script src="./main.js"></script>
</body>
</html>
